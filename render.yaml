# Render Blueprint - deploys the Minesweeper Learning Lab as:
#   1. Render Postgres      (database: experiments, games, moves and the persistent playbook)
#   2. ala-backend          (FastAPI + in-process experiment runner, Docker)
#   3. ala-frontend         (React static site)
#
# After the first deploy, open the frontend URL and register an account.

databases:
  - name: ala-postgres
    databaseName: learning_agent
    user: agent
    plan: free
    # Change to `oregon` if `singapore` is unavailable for your account.
    region: singapore

services:
  # --- Backend API + in-process experiment runner (keep a single instance) ---
  - type: web
    name: ala-backend
    runtime: docker
    region: singapore
    # Free tier (512 MB) is enough. Free services sleep after 15 min without HTTP
    # traffic, which interrupts a running experiment; it can be resumed from the
    # UI at the next unfinished game. Paid plans stay up for long runs.
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ala-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Code-only agents: no LLM or API key needed. (LLM agents are disabled; see README.)
      - key: ENABLE_LLM_AGENTS
        value: "false"

  # --- Frontend (static site with SPA fallback) ---
  - type: web
    name: ala-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Public hostname of the backend service, injected at build time.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ala-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      # Serve index.html for client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
